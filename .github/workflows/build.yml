name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Project & Add Dependencies
        run: |
          cd ..
          flutter create --org com.mylivestream streamapp
          cd streamapp
          flutter pub add zego_uikit_prebuilt_live_streaming:^3.6.4
          cp ../my-live-app/lib/main.dart lib/main.dart

          # Root build.gradle mein sabhi plugins ke compileSdk ko zabardasti 36 par set karna
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # App level par compileSdk aur minSdk update karna
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../my-live-app/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-app
          path: app-release.apk
          
