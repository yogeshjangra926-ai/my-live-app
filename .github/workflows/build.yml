name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Project & Add Dependencies
        run: |
          cd ..
          flutter create --org com.mylivestream streamapp
          cd streamapp
          flutter pub add zego_uikit_prebuilt_live_streaming
          
          # Fix minSdk and compileSdk versions for ZegoCloud
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 34/g' android/app/build.gradle || true
          
          cp -f ../my-live-app/lib/main.dart lib/main.dart
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../my-live-app/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-app
          path: app-release.apk
          
          
